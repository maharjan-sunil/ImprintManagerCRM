syntax = "proto3";

option csharp_namespace = "Email.Grpc";

package email;

message Attachment {
  string file_name = 1;
  bytes content = 2;
  string content_type = 3;
}

message Header {
  string key = 1;              // e.g., X-Correlation-Id
  string value = 2;
}

message SendEmailRequest {
  string from = 1;           
  repeated string to = 2; 
  repeated string cc = 3;
  repeated string bcc = 4;
  string subject = 5;
  string html_body = 6;
  string text_body = 7; 
  repeated Attachment attachments = 8;
  repeated Header headers = 9; // custom SMTP headers/metadata
}

message SendEmailResponse {
  bool success = 1;
  string message_id = 2;       // SMTP or provider message id if available
  string error = 3;      
}

message SendTemplateEmailRequest {
  string template_name = 1;    // server-resolved template
  map<string,string> data = 2; // key=value for templating
  string to = 3;          
  string subject = 4;
}

service EmailService {
  rpc SendEmail (SendEmailRequest) returns (SendEmailResponse);
  rpc SendTemplateEmail (SendTemplateEmailRequest) returns (SendEmailResponse);
}